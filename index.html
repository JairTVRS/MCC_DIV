<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap"
    />
    <title>MCC DIVINÓPOLIS · Agenda de Locações</title>
    <meta name="description" content="Agenda e gestão das locações da casa: reservas, pagamentos e documentos num só lugar." />
    <!-- Prévia do link no WhatsApp e redes sociais (lidas sem rodar o JavaScript; a imagem precisa de endereço completo). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MCC DIVINÓPOLIS" />
    <meta property="og:url" content="https://mcc-div.pages.dev/" />
    <meta property="og:title" content="MCC DIVINÓPOLIS · Agenda de Locações" />
    <meta property="og:description" content="Agenda e gestão das locações da casa: reservas, pagamentos e documentos num só lugar." />
    <meta property="og:image" content="https://mcc-div.pages.dev/marca/compartilhar.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo MCC DIV · Agenda de Locações" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar.
      try {
        var t = localStorage.getItem('tema');
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
